name: Build NEXUS BOOST v3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows EXE
        run: >-
          dotnet publish ./NexusBoost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o ./publish

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-BOOST-v3-Windows
          path: publish/
